name: relay

on:
  pull_request:
    paths:
      - 'server/relay/**'
      - '.github/workflows/relay.yml'

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm version comes from the `packageManager` field in server/relay/package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: server/relay/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: server/relay/pnpm-lock.yaml

      - name: Install
        run: pnpm --dir server/relay install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir server/relay typecheck

      - name: Lint
        run: pnpm --dir server/relay lint

      - name: Format
        run: pnpm --dir server/relay format:check

      - name: Test
        run: pnpm --dir server/relay test

      - name: Build
        run: pnpm --dir server/relay build

      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: server/relay/Dockerfile
